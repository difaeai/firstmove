name: Deploy to Firebase App Hosting

# The live site (www.firstoptionworldwide.com) is served by Firebase
# App Hosting — backend "firstmove". App Hosting builds from the repo, so
# this workflow just asks it to create a new rollout from the latest commit
# on the default branch whenever changes land there.
on:
  push:
    branches: ['claude/eager-ramanujan-7hi6dz']
  workflow_dispatch: {}

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create App Hosting rollout
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Write the service-account key to a file and point the CLI at it.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"

          firebase apphosting:rollouts:create firstmove \
            --project firstmove-ff051 \
            --git-branch claude/eager-ramanujan-7hi6dz \
            --force
